name: nihongobridge_mobile
description: A production-grade, enterprise Flutter application for Nihongo Bridge, supporting Android, iOS, Tablet, and Desktop with offline SQLite, Riverpod state management, and Dio networking.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5

  # State Management & DI
  flutter_riverpod: ^2.3.6
  riverpod_annotation: ^2.1.1

  # Networking & HTTP
  dio: ^5.2.1

  # Local Databases & Offline Cache
  sqflite: ^2.2.8+4
  path_provider: ^2.0.15
  path: ^1.8.3

  # Push Notifications
  flutter_local_notifications: ^14.1.1
  firebase_messaging: ^14.6.4

  # Asset Utilities
  file_picker: ^5.3.3
  open_file: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  riverpod_generator: ^2.2.3
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
